<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e100ff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#090d16"/>
  
  <!-- Outer subtle aura -->
  <circle cx="256" cy="256" r="140" fill="url(#cloudGrad)" opacity="0.22" filter="url(#neonGlow)"/>

  <!-- Cloud Path -->
  <g filter="url(#neonGlow)">
    <path d="M 370 330 
             L 170 330 
             A 65 65 0 0 1 140 205 
             A 85 85 0 0 1 270 145 
             A 75 75 0 0 1 385 220 
             A 55 55 0 0 1 370 330 Z" 
          fill="none" 
          stroke="url(#cloudGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Subtle inner electric accent -->
    <path d="M 270 200 L 245 250 L 275 250 L 245 305" 
          stroke="#00f2fe" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"
          opacity="0.9"/>
  </g>
</svg>
